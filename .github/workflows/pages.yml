name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that Pages is on
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Pages is off
        if: steps.pages.outcome != 'success'
        run: echo "GitHub Pages is off. Turn it on in Settings, Pages, Source GitHub Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
      - name: Check out
        if: steps.pages.outcome == 'success'
        uses: actions/checkout@v7
      - name: Collect the site
        if: steps.pages.outcome == 'success'
        run: |
          mkdir _site
          cp b1-wortschatz-geschichten.html _site/index.html
          cp declension-quiz.html verb-prep-trainer.html sprachbausteine-teil2-flashcards.html _site/
      - name: Upload the site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5
